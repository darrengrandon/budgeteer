  <rect x="224" y="206" width="64" height="170" rx="20" fill="#ffffff" fill-opacity="0.85"/>
  <rect x="312" y="156" width="64" height="220" rx="20" fill="#ffffff"/>
  <circle cx="344" cy="112" r="26" fill="#ffd166"/>
</svg>
